services:
  # 1. Managed Redis Service (Free Plan)
  - type: redis
    name: skms-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # 2. Web Service (Laravel with FrankenPHP, Octane, and Queue Worker)
  - type: web
    name: skms-unimar-web
    runtime: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: SKMS-Unimar
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        value: "base64:JxOW2xsfXCWLqQnwtK1ZdKiK7IiQvhjVjPJ/vPLONZ8="
      - key: APP_URL
        value: https://skms-unimar-web.onrender.com # Replace with your custom domain if mapping one
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: skms-unimar-regnaultjavier2-7827.d.aivencloud.com
      - key: DB_PORT
        value: "25080"
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: ""
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: "false"
      - key: REDIS_HOST
        fromService:
          type: redis
          name: skms-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: skms-redis
          property: port
      - key: QUEUE_CONNECTION
        value: redis
      - key: CACHE_STORE
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: SUPER_ADMIN_EMAIL
        value: god@unimar.edu.ve
      - key: SUPER_ADMIN_PASSWORD
        value: --god--


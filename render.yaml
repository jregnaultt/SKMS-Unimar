services:
  # 1. Managed Redis Service (Free Plan)
  - type: redis
    name: skms-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # 2. Web Service (Laravel with FrankenPHP, Octane, and Queue Worker)
  - type: web
    name: skms-unimar-web
    runtime: docker
    plan: free
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_NAME
        value: SKMS-Unimar
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://skms-unimar-web.onrender.com # Replace with your custom domain if mapping one
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        fromService:
          type: redis
          name: skms-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: skms-redis
          property: port
      - key: QUEUE_CONNECTION
        value: redis
      - key: CACHE_STORE
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: OCTANE_SERVER
        value: frankenphp
